<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Code Editor - محرر الأكواد الذكي</title>
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <style>
        :root {
            --primary: #00897b;
            --primary-dark: #00695c;
            --bg-dark: #1e1e1e;
            --toolbar-bg: #252526;
            --text-color: #e0e0e0;
            --accent-match: #ff9800;
            --replace-color: #2e7d32;
            --replace-hover: #1b5e20;
            --popup-bg: #2d2d2d;
            --popup-border: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            gap: 6px;
            z-index: 100;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }

        .title-area span#file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn {
            background-color: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #444;
        }

        .btn-icon-only {
            padding: 5px 7px;
        }

        .btn-icon-only svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary-dark);
        }

        .search-panel {
            background-color: #2a2a2b;
            padding: 6px 10px;
            border-bottom: 2px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .search-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            background: #181818;
            border: 1px solid #484848;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            direction: ltr;
            text-align: left;
            font-family: 'Consolas', 'Courier New', monospace;
            resize: vertical;
            min-height: 36px;
            max-height: 90px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 137, 123, 0.2);
        }

        .search-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #aaa;
            padding: 0 2px;
        }

        .similarity-tag {
            color: #4caf50;
            font-weight: bold;
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 14px;
            direction: ltr;
            line-height: 1.5;
            touch-action: pan-x pan-y !important;
        }

        .CodeMirror-lines, 
        .CodeMirror-line, 
        .CodeMirror-code,
        .CodeMirror-scroll {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .CodeMirror-gutters {
            border-right: 1px solid #333;
            background-color: #1a1a1a;
            white-space: nowrap;
        }

        .smart-highlight {
            background-color: rgba(255, 152, 0, 0.35) !important;
            border-bottom: 2px solid #ff9800;
        }

        /* شريط الأوامر السريعة المتجاوب مع مقاس الشاشة */
        .quick-action-bar {
            position: absolute;
            z-index: 999999 !important;
            display: none;
            background: var(--popup-bg);
            border: 1px solid var(--popup-border);
            border-radius: 8px;
            padding: 3px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
            flex-direction: row;
            align-items: center;
            gap: 2px;
            pointer-events: auto;
            transform: translate(-50%, -100%);
            user-select: none;
            direction: ltr;
            max-width: calc(100vw - 16px);
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .quick-action-bar::-webkit-scrollbar {
            display: none;
        }

        .quick-action-bar::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: var(--popup-bg) transparent transparent transparent;
        }

        .qa-btn {
            background: transparent;
            border: none;
            color: #efefef;
            padding: 5px 7px;
            border-radius: 5px;
            font-size: 0.75rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .qa-btn:active {
            background: #444;
        }

        .qa-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .qa-btn.btn-replace-accent {
            background-color: var(--replace-color);
            color: #fff;
            font-weight: bold;
            padding: 5px 8px;
        }

        .qa-btn.btn-replace-accent:active {
            background-color: var(--replace-hover);
        }

        .qa-divider {
            width: 1px;
            height: 16px;
            background: #444;
            margin: 0 1px;
            flex-shrink: 0;
        }

        footer {
            background-color: #181818;
            border-top: 1px solid #2a2a2a;
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: #777;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-area">
            <span>📝</span>
            <span id="file-name">ملف جديد.txt</span>
        </div>
        <div class="btn-group">
            <!-- زري التراجع والإعادة الثابتين دائماً -->
            <button class="btn btn-icon-only" onclick="editorUndo()" title="تراجع">
                <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            </button>
            <button class="btn btn-icon-only" onclick="editorRedo()" title="إعادة">
                <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
            </button>
            
            <button class="btn" onclick="document.getElementById('file-input').click()">
                📂 فتح
            </button>
            <input type="file" id="file-input" accept=".txt,.html,.js,.css,.py,.json,.php,.java,.c,.cpp">
            
            <button class="btn btn-primary" onclick="downloadFile()">
                💾 حفظ
            </button>
        </div>
    </header>

    <!-- شريط الأوامر السريعة العائم فوق النص المحدد -->
    <div id="quick-action-bar" class="quick-action-bar">
        <button class="qa-btn btn-replace-accent" onclick="quickReplaceWithClipboard()" title="استبدال بآخر ما تم نسخه">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v3h10V5h2v14z"/><path d="M12 18l4-4h-3V9h-2v5H8z"/></svg>
            <span>استبدال</span>
        </button>
        <div class="qa-divider"></div>
        <button class="qa-btn" onclick="quickCopy()" title="نسخ">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span>نسخ</span>
        </button>
        <button class="qa-btn" onclick="quickCut()" title="قص">
            <svg viewBox="0 0 24 24"><path d="M9.64 7.64c.23-.5.36-1.05.36-1.64 0-2.21-1.79-4-4-4S2 3.79 2 6s1.79 4 4 4c.59 0 1.14-.13 1.64-.36L10 12l-2.36 2.36C7.14 14.13 6.59 14 6 14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4c0-.59-.13-1.14-.36-1.64L12 14l7 7h3v-1L9.64 7.64zM6 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm16-4h-3l-4-4 2.5-2.5L22 15v1z"/></svg>
            <span>قص</span>
        </button>
        <button class="qa-btn" onclick="quickPaste()" title="لصق">
            <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            <span>لصق</span>
        </button>
        <button class="qa-btn" onclick="quickSelectAll()" title="تحديد الكل">
            <svg viewBox="0 0 24 24"><path d="M3 5h2V3c-1.1 0-2 .9-2 2zm0 8h2v-2H3v2zm4 8h2v-2H7v2zM3 9h2V7H3v2zm10-6h-2v2h2V3zm6 0v2h2c0-1.1-.9-2-2-2zm-6 18h2v-2h-2v2zm-8-8h10V7H5v6zm2-4h6v2H7V9zm14-4v2h2V5c0-1.1-.9-2-2-2zm0 6h2V9h-2v2zm0 4h2v-2h-2v2zm0 4c0 1.1-.9 2 2 2v-2h-2zm-4 4h2v-2h-2v2zM3 19c0 1.1.9 2 2 2v-2H3z"/></svg>
            <span>الكل</span>
        </button>
        <div class="qa-divider"></div>
        <button class="qa-btn" onclick="editorUndo()" title="تراجع">
            <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            <span>تراجع</span>
        </button>
        <button class="qa-btn" onclick="editorRedo()" title="إعادة">
            <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
            <span>إعادة</span>
        </button>
    </div>

    <!-- شريط البحث الذكي -->
    <div class="search-panel">
        <div class="search-row">
            <textarea id="search-box" class="search-input" placeholder="الصق هنا الكود القديم للبحث عنه..." rows="1"></textarea>
            <button class="btn btn-primary" onclick="executeSmartSearch()" style="height: 36px; padding: 0 12px; white-space: nowrap;">
                🔍 انتقال
            </button>
        </div>
        <div class="search-info">
            <span id="match-status">البحث الذكي يتجاهل الفراغات والشروحات العربية للأكواد</span>
            <span id="match-score" class="similarity-tag"></span>
        </div>
    </div>

    <!-- المحرر -->
    <div class="editor-container" id="editor-container">
        <textarea id="editor"></textarea>
    </div>

    <footer>
        <span id="cursor-pos">السطر: 1 | العمود: 1</span>
        <span>Auto-Save مُفعّل تلقائياً</span>
    </footer>

    <!-- مكتبات الدعم -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

    <script>
        let currentFilename = "index.html";
        let markInstances = [];
        const quickActionBar = document.getElementById('quick-action-bar');
        const container = document.getElementById('editor-container');

        const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            lineNumbers: true,
            theme: 'material-darker',
            mode: 'htmlmixed',
            lineWrapping: false,
            autoCloseBrackets: true,
            matchBrackets: true,
            direction: 'ltr',
            viewportMargin: 20,
            inputStyle: 'contenteditable'
        });

        // منع قائمة المتصفح الافتراضية لمنع تداخلها مع قائمتك
        container.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, true);

        // استعادة المحتوى المحفوظ
        const savedCode = localStorage.getItem('smart_editor_code');
        if (savedCode) {
            editor.setValue(savedCode);
        } else {
            editor.setValue(`<!DOCTYPE html>\n<html>\n<head>\n    <title>تطبيق تجريبي</title>\n</head>\n<body>\n    <h1>مرحباً بك!</h1>\n    <p>حدد أي كود لتظهر لك خيارات النسخ واللصق والتراجع الفوري.</p>\n</body>\n</html>`);
        }

        editor.on('change', () => {
            localStorage.setItem('smart_editor_code', editor.getValue());
        });

        // دوال التراجع والإعادة
        function editorUndo() {
            editor.undo();
            editor.focus();
            setTimeout(updateQuickActionBar, 20);
        }

        function editorRedo() {
            editor.redo();
            editor.focus();
            setTimeout(updateQuickActionBar, 20);
        }

        // تموضع شريط الأوامر واحتوائه بالكامل داخل حدود الشاشة
        function updateQuickActionBar() {
            if (!editor.somethingSelected()) {
                quickActionBar.style.display = 'none';
                return;
            }

            const from = editor.getCursor("from");
            const to = editor.getCursor("to");
            
            const startCoords = editor.cursorCoords(from, "page");
            const endCoords = editor.cursorCoords(to, "page");
            
            const midX = (startCoords.left + endCoords.right) / 2;
            const topY = Math.min(startCoords.top, endCoords.top) - 12;

            quickActionBar.style.display = 'flex';
            
            const barWidth = quickActionBar.offsetWidth || 280;
            const halfBar = barWidth / 2;
            
            // ضمان عدم خروج الشريط خارج الشاشة أفقياً
            let safeX = midX;
            if (safeX - halfBar < 10) {
                safeX = halfBar + 10;
            } else if (safeX + halfBar > window.innerWidth - 10) {
                safeX = window.innerWidth - halfBar - 10;
            }

            // إظهار الشريط أسفل التحديد إذا كان قريباً جداً من الحافة العلوية
            let safeY = topY;
            if (safeY < 65) {
                safeY = Math.max(startCoords.bottom, endCoords.bottom) + 38;
            }

            quickActionBar.style.left = safeX + 'px';
            quickActionBar.style.top = safeY + 'px';
        }

        editor.on('cursorActivity', () => {
            const pos = editor.getCursor();
            document.getElementById('cursor-pos').innerText = `السطر: ${pos.line + 1} | العمود: ${pos.ch + 1}`;
            requestAnimationFrame(updateQuickActionBar);
        });

        editor.on('scroll', () => {
            if (editor.somethingSelected()) {
                updateQuickActionBar();
            } else {
                quickActionBar.style.display = 'none';
            }
        });

        // تحديد كامل النص بنجاح وسلاسة
        function quickSelectAll() {
            editor.focus();
            const totalLines = editor.lineCount();
            const lastLineLen = editor.getLine(totalLines - 1).length;
            editor.setSelection({ line: 0, ch: 0 }, { line: totalLines - 1, ch: lastLineLen });
            setTimeout(updateQuickActionBar, 30);
        }

        async function quickReplaceWithClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text) {
                    alert('الحافظة فارغة! انسخ الكود الجديد أولاً.');
                    return;
                }
                editor.replaceSelection(text);
                quickActionBar.style.display = 'none';
                markInstances.forEach(m => m.clear());
                markInstances = [];
                document.getElementById('match-status').innerText = '✅ تم الاستبدال بنجاح!';
            } catch (err) {
                const fallbackText = prompt("الصق الكود الجديد هنا للاستبدال المباشر:");
                if (fallbackText !== null) {
                    editor.replaceSelection(fallbackText);
                    quickActionBar.style.display = 'none';
                    markInstances.forEach(m => m.clear());
                    markInstances = [];
                    document.getElementById('match-status').innerText = '✅ تم الاستبدال بنجاح!';
                }
            }
        }

        async function quickCopy() {
            const text = editor.getSelection();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                quickActionBar.style.display = 'none';
            } catch (e) {
                document.execCommand('copy');
                quickActionBar.style.display = 'none';
            }
        }

        async function quickCut() {
            const text = editor.getSelection();
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
            } catch(e) {
                document.execCommand('copy');
            }
            editor.replaceSelection('');
            quickActionBar.style.display = 'none';
        }

        async function quickPaste() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    editor.replaceSelection(text);
                }
            } catch (e) {
                const text = prompt("الصق المحتوى هنا:");
                if (text !== null) {
                    editor.replaceSelection(text);
                }
            }
            quickActionBar.style.display = 'none';
        }

        // فتح وتنزيل الملفات
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            currentFilename = file.name;
            document.getElementById('file-name').innerText = currentFilename;
            
            const reader = new FileReader();
            reader.onload = function(evt) {
                editor.setValue(evt.target.result);
                localStorage.setItem('smart_editor_code', evt.target.result);
            };
            reader.readAsText(file);
        });

        function downloadFile() {
            const text = editor.getValue();
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = currentFilename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        // خوارزمية البحث والمطابقة
        function normalizeCode(str) {
            return str
                .replace(/[\u0600-\u06FF]/g, '')
                .replace(/\/\/.*$/gm, '')
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s+/g, '')
                .toLowerCase();
        }

        function calculateSimilarity(str1, str2) {
            if (str1 === str2) return 1.0;
            if (str1.length < 2 || str2.length < 2) return 0.0;

            const bigrams = new Map();
            for (let i = 0; i < str1.length - 1; i++) {
                const bg = str1.substr(i, 2);
                bigrams.set(bg, (bigrams.get(bg) || 0) + 1);
            }

            let intersection = 0;
            for (let i = 0; i < str2.length - 1; i++) {
                const bg = str2.substr(i, 2);
                const count = bigrams.get(bg) || 0;
                if (count > 0) {
                    bigrams.set(bg, count - 1);
                    intersection++;
                }
            }

            return (2.0 * intersection) / (str1.length + str2.length - 2);
        }

        function executeSmartSearch() {
            const searchInput = document.getElementById('search-box');
            const queryRaw = searchInput.value;
            
            if (!queryRaw.trim()) {
                alert('يرجى لصق النص أو الكود المراد البحث عنه أولاً');
                return;
            }

            quickActionBar.style.display = 'none';
            markInstances.forEach(m => m.clear());
            markInstances = [];

            const queryNorm = normalizeCode(queryRaw);
            if (queryNorm.length === 0) {
                alert('النص المدخل يحتوي فقط على شروحات ولا يوجد به كود برمجي للمطابقة!');
                return;
            }

            const queryLines = queryRaw.trim().split('\n').length;
            const doc = editor.getDoc();
            const totalLines = doc.lineCount();

            let bestMatch = {
                startLine: 0,
                endLine: 0,
                score: -1
            };

            const windowMargin = Math.max(2, Math.floor(queryLines * 0.5));
            const minWindow = Math.max(1, queryLines - windowMargin);
            const maxWindow = queryLines + windowMargin;

            for (let start = 0; start < totalLines; start++) {
                for (let w = minWindow; w <= maxWindow && (start + w) <= totalLines; w++) {
                    const end = start + w;
                    
                    let blockLines = [];
                    for (let i = start; i < end; i++) {
                        blockLines.push(doc.getLine(i));
                    }
                    const blockText = blockLines.join('\n');
                    const blockNorm = normalizeCode(blockText);

                    if (blockNorm.length === 0) continue;

                    if (blockNorm === queryNorm) {
                        bestMatch = { startLine: start, endLine: end - 1, score: 1.0 };
                        break;
                    }

                    const sim = calculateSimilarity(queryNorm, blockNorm);
                    if (sim > bestMatch.score) {
                        bestMatch = {
                            startLine: start,
                            endLine: end - 1,
                            score: sim
                        };
                    }
                }
                if (bestMatch.score === 1.0) break;
            }

            if (bestMatch.score > 0.25) {
                const scorePercent = Math.round(bestMatch.score * 100);
                document.getElementById('match-status').innerText = `تم الانتقال للسطور (${bestMatch.startLine + 1} - ${bestMatch.endLine + 1})`;
                document.getElementById('match-score').innerText = `تطابق: ${scorePercent}%`;

                // تفريغ مربع البحث تلقائياً لسرعة البحث التالي
                searchInput.value = '';

                // تمييز وتحديد الكود
                for (let i = bestMatch.startLine; i <= bestMatch.endLine; i++) {
                    const lineLength = doc.getLine(i).length;
                    const mark = doc.markText(
                        { line: i, ch: 0 },
                        { line: i, ch: lineLength },
                        { className: 'smart-highlight' }
                    );
                    markInstances.push(mark);
                }

                // التمرير والتحديد
                editor.scrollIntoView({ line: bestMatch.startLine, ch: 0 }, 200);
                editor.setSelection(
                    { line: bestMatch.startLine, ch: 0 },
                    { line: bestMatch.endLine, ch: doc.getLine(bestMatch.endLine).length }
                );
                
                setTimeout(updateQuickActionBar, 50);
                editor.focus();
            } else {
                document.getElementById('match-status').innerText = 'لم يتم العثور على كود مطابق بدرجة مقبولة';
                document.getElementById('match-score').innerText = '';
                alert('تعذر العثور على مكان النص! تأكد من وجوده في الملف.');
            }
        }
    </script>
</body>
</html>
